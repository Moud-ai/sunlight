[package]
name = "sunlight-download"
version = "0.2.0"
edition = "2021"
description = "High-performance chunked download manager for Sunlight app"

[lib]
name = "sunlight_download"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
