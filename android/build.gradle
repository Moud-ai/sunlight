buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.0-2.0.2")
        // Only resolved when Firebase push notifications are enabled
        // (sunlightFirebase gradle property). F-Droid builds skip it.
        if (project.hasProperty('sunlightFirebase') && project.property('sunlightFirebase').toBoolean()) {
            classpath("com.google.gms:google-services:4.4.2")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
