// Vendored from termux-app v0.118.0 (commit 6e2689f55295fa444be8ac8592c527c2c5ef3253).
// Upstream module: https://github.com/termux/termux-app/tree/v0.118.0/terminal-view
// License: GPLv3 — see android/TERMINAL_LICENSE_NOTE.md.
//
// Adjusted from upstream for this repo's AGP/Gradle setup:
//  - explicit `namespace` instead of the manifest package attribute,
//  - compile/minSdk taken from the root project ext,
//  - maven-publish / sourceJar tasks removed (not publishing).
apply plugin: 'com.android.library'

android {
    namespace 'com.termux.view'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    api project(':terminal-emulator')
}
