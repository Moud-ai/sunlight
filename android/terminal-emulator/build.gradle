// Vendored from termux-app v0.118.0 (commit 6e2689f55295fa444be8ac8592c527c2c5ef3253).
// Upstream module: https://github.com/termux/termux-app/tree/v0.118.0/terminal-emulator
// License: GPLv3 — see android/TERMINAL_LICENSE_NOTE.md.
//
// Adjusted from upstream for this repo's AGP/Gradle setup:
//  - explicit `namespace` instead of the manifest package attribute,
//  - compile/minSdk taken from the root project ext,
//  - arm64-v8a only (matches reactNativeArchitectures),
//  - maven-publish / sourceJar tasks removed (not publishing).
apply plugin: 'com.android.library'

android {
    namespace 'com.termux.terminal'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
