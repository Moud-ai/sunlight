apply plugin: "com.android.application"
// Firebase (Google proprietary) is opt-in via gradle property
// `sunlightFirebase=true`. F-Droid builds MUST NOT enable it.
if (project.hasProperty('sunlightFirebase') && project.property('sunlightFirebase').toBoolean()) {
    apply plugin: "com.google.gms.google-services"
}
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * App version single source of truth: package.json. Every release MUST bump
 * it so installed builds are distinguishable in Settings/app-info and stale
 * APKs are obvious on the home screen.
 */
def packageJson = new groovy.json.JsonSlurper().parseText(
    file('../../package.json').text,
)
def appVersionName = packageJson.version as String
def versionBits = appVersionName.tokenize('.').collect {it.toInteger() as int}
def appVersionCode = versionBits[0] * 10000 + versionBits[1] * 100 + versionBits[2]

/**
 * Release signing credentials: android/keystore.properties (gitignored, local
 * builds) takes precedence over SUNLIGHT_* env vars; without either, release
 * falls back to the debug key (F-Droid convention).
 */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseSigning = keystorePropsFile.exists() ||
    System.getenv('SUNLIGHT_STORE_FILE') != null

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.moud.sunlight"
    defaultConfig {
        applicationId "com.moud.sunlight"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        ndk {
          abiFilters "arm64-v8a"
        }
        versionName appVersionName
        // Required by react-native-app-auth: registers the redirect
        // scheme (sunlight://) in the manifest via its placeholder.
        manifestPlaceholders += [appAuthRedirectScheme: "com.moud.sunlight"]
        // Launcher label carries the exact build version so a stale install
        // is betrayed by the home-screen icon before opening anything.
        manifestPlaceholders += [launcherLabel: "Sunlight ${appVersionName}"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing: keystore.properties (gitignored) for local builds,
        // SUNLIGHT_* env vars for CI; falls back to debug for F-Droid.
        if (hasReleaseSigning) {
            release {
                if (keystorePropsFile.exists()) {
                    storeFile file(keystoreProps['storeFile'])
                    storePassword keystoreProps['storePassword']
                    keyAlias keystoreProps['keyAlias']
                    keyPassword keystoreProps['keyPassword']
                } else {
                    storeFile file(System.getenv('SUNLIGHT_STORE_FILE'))
                    storePassword System.getenv('SUNLIGHT_STORE_PASSWORD')
                    keyAlias System.getenv('SUNLIGHT_KEY_ALIAS')
                    keyPassword System.getenv('SUNLIGHT_KEY_PASSWORD')
                }
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    // Self-describing artifact names make stale downloads obvious.
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def tag = abi != null ? abi : 'arm64-v8a'
            output.outputFileName = "sunlight-v${appVersionName}-${tag}.apk"
        }
    }
}

dependencies {
    // Vendored GPLv3 Termux terminal libraries (see android/TERMINAL_LICENSE_NOTE.md).
    implementation project(':terminal-emulator')
    implementation project(':terminal-view')

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
        // Material Design 3 (dynamic color / Material You support).
        implementation("com.google.android.material:material:1.12.0")
        // Firebase Cloud Messaging is proprietary Google infrastructure and
        // an optional feature of this app. It is enabled only when the
        // `sunlightFirebase` gradle property is set; F-Droid builds omit it.
        if (project.hasProperty('sunlightFirebase') && project.property('sunlightFirebase').toBoolean()) {
            implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
            implementation("com.google.firebase:firebase-messaging")
        }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
